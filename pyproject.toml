[project]
name = "credit-drift-monitor"
version = "0.1.0"
description = "Camada de sustentacao e confiabilidade de um modelo de Credit Scoring: data contracts, deteccao de drift, observabilidade e governanca (LGPD)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Modelo base de risco de credito (Etapa 1 -- ver docs/adr/0003)
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    # Data Contracts (Etapa 1 -- ver docs/adr/0002)
    "pandera>=0.24",
    # Manipulacao de dados
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
]

[dependency-groups]
# Download do dataset bruto (Kaggle). Nao e necessario para treinar/validar
# se o CSV for baixado manualmente para data/raw/.
data = [
    # >=1.8: suporte ao token novo (KAGGLE_API_TOKEN / ~/.kaggle/access_token)
    "kaggle>=1.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.uv]
# Projeto sem [build-system]: nao ha pacote a construir, apenas um ambiente
# a sincronizar (mesmo padrao da Fase 3).
package = false
default-groups = ["dev", "data"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
