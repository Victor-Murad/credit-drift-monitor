name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Instalar ambiente (travado pelo uv.lock)
        run: uv sync --locked

      # Os testes usam dados sinteticos: o dataset do Kaggle nao e versionado
      # (licenca) e o CI nao tem credenciais.
      - name: Lint (ruff + import-linter)
        run: make lint

      - name: Testes com cobertura (piso em pyproject.toml)
        run: make test-cov
